name = "dracul-briefing-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Node.js compatibility for sockets and streams
compatibility_flags = [ "nodejs_compat" ]

[vars]
RECIPIENT_EMAIL = "support@draculcybersec.com"
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
SMTP_FROM = "support@draculcybersec.com"
# SMTP_USER and SMTP_PASS should be set as encrypted secrets:
# wrangler secret put SMTP_USER
# wrangler secret put SMTP_PASS
