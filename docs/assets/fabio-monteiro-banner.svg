  <rect x="-28" y="-66" width="560" height="144" fill="url(#blocks)" opacity="1"/>
  <rect x="1250" y="332" width="620" height="130" fill="url(#blocks)" opacity=".95"/>
  <rect x="1390" y="-42" width="500" height="118" fill="url(#blocks)" opacity=".52"/>
