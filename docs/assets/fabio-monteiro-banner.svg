      <circle cx="76" cy="76" r="76" stroke="#d1d5db" stroke-width="18"/>
      <circle cx="76" cy="76" r="42" stroke="#d1d5db" stroke-width="7" opacity=".58"/>
      <path d="M76-30v58M76 124v58M-30 76h58M124 76h58M2 2l42 42M150 2l-42 42M2 150l42-42M150 150l-42-42" stroke="#d1d5db" stroke-width="18"/>
