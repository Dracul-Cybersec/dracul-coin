<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="420" viewBox="0 0 1920 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11191b"/>
      <stop offset=".44" stop-color="#071012"/>
      <stop offset="1" stop-color="#0b1113"/>
    </linearGradient>
    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f1d1d" stop-opacity=".18"/>
      <stop offset=".52" stop-color="#ef2020" stop-opacity=".95"/>
      <stop offset="1" stop-color="#7f1d1d" stop-opacity=".16"/>
    </linearGradient>
    <pattern id="blocks" width="42" height="42" patternUnits="userSpaceOnUse">
      <rect x="4" y="3" width="17" height="17" fill="#ef2020" opacity=".36"/>
      <rect x="25" y="24" width="17" height="17" fill="#fca5a5" opacity=".08"/>
    </pattern>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 .7 0 0.05 0 0 .05 0 0 0.05 0 0.06 0 0 0 .55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dragonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#ef2020" flood-opacity=".42"/>
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".62"/>
    </filter>
  </defs>

  <rect width="1920" height="420" fill="url(#bg)"/>
